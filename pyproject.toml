[project]
name = "research-workbench"
version = "0.2.0"
description = "Evidence-linked computational research workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10,<3",
    "pypdfium2>=4,<6",
]
[project.scripts]
workbench = "workbench.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "pypdf>=5", "pdfplumber>=0.11"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
