name: Verify workbench
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install
      - run: make check
      - run: make contracts
      - run: git diff --exit-code -- openapi.json web/src/contracts.ts
      - name: PostgreSQL contract tests
        run: make postgres-check
        env:
          WORKBENCH_DOCKER_CONTEXT: default
